# Builds the documentation site in docs/ and publishes it to GitHub Pages
# (https://alvfdz.github.io/nutria/). Needs Settings → Pages → Source set to
# "GitHub Actions".
#
# Only `main` publishes: docs changes merged into `develop` go live with the
# release that brings them to `main`. Settings → Environments → github-pages
# must allow deployments from `main`. Pull requests that touch the docs only
# build them, so a broken page fails the PR instead of the deployment.
name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A newer push to the same PR cancels its build still in progress.
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          path: docs

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deployment at a time; a newer push replaces a queued one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
