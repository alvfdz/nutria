# Runs the same checks as "Before you open a pull request" in CONTRIBUTING.md,
# plus coverage, on every push to and pull request against `main`. The suite
# mocks the Prisma client, so no database is needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # `postinstall` runs `prisma generate`, which typecheck and the tests
      # need.
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      # Writes the totals from `coverage/coverage-summary.json` to the run's
      # summary page, which lasts as long as the run, unlike the artifact.
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node --input-type=module <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from "node:fs";

          const { total } = JSON.parse(
            readFileSync("coverage/coverage-summary.json", "utf8"),
          );
          const rows = ["statements", "branches", "functions", "lines"].map(
            (key) => {
              const { pct, covered, total: count } = total[key];
              const name = key[0].toUpperCase() + key.slice(1);
              return `| ${name} | ${pct}% | ${covered} / ${count} |`;
            },
          );
          console.log(
            [
              "## Coverage",
              "",
              "| Metric | Coverage | Covered |",
              "| --- | ---: | ---: |",
              ...rows,
            ].join("\n"),
          );
          EOF
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 14
