# Builds the desktop app with the same scripts contributors run locally and
# attaches the results to the GitHub release that triggered the run, where
# the documentation tells people to download them from:
#
# - the Flatpak, for Linux (`npm run desktop:flatpak`);
# - the installer, for Windows (`npm run desktop:package`);
# - the disk images, for macOS (`npm run desktop:package`), one for Apple
#   processors and one for Intel ones.
#
# Run it by hand ("Run workflow") to try the builds on any branch: the files
# are then only kept as artifacts of the run.
#
# A pull request that touches the desktop app builds them too, kept the same
# way: each can only be built on the system it is for, and not every
# contributor has all three.
name: Desktop release

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop-release.yml"]

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-latest
    permissions:
      # Uploading a file to the release.
      contents: write
    # A newer push to the same PR cancels its build still in progress.
    concurrency:
      group: desktop-flatpak-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      # The bundle is named and versioned from package.json, so a release
      # whose tag disagrees with it would publish a mislabeled file.
      - name: Check the tag matches package.json
        if: ${{ github.event_name == 'release' }}
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::package.json is at $version but the release tag is $TAG"
            exit 1
          fi
      - name: Install Flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          # The runner's AppArmor policy keeps unprivileged programs from
          # creating user namespaces, which the build sandbox is made of.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      # Builds the app, packages it, and installs the runtime, SDK and base
      # app the manifest names from Flathub.
      - run: npm run desktop:flatpak
      - uses: actions/upload-artifact@v7
        with:
          name: nutria-flatpak
          path: desktop/release/*.flatpak
          if-no-files-found: error
          retention-days: 14
      - name: Attach the bundle to the release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" desktop/release/*.flatpak --clobber

  # Unsigned: Windows warns on the first launch that it doesn't know the
  # publisher. The documentation tells people how to go on.
  windows:
    runs-on: windows-latest
    permissions:
      # Uploading a file to the release.
      contents: write
    # A newer push to the same PR cancels its build still in progress.
    concurrency:
      group: desktop-windows-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Check the tag matches package.json
        if: ${{ github.event_name == 'release' }}
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::package.json is at $version but the release tag is $TAG"
            exit 1
          fi
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      # Builds the app and packages it into the installer.
      - run: npm run desktop:package
      - uses: actions/upload-artifact@v7
        with:
          name: nutria-windows
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Attach the installer to the release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" desktop/release/*.exe --clobber

  # Signed ad hoc, with no certificate: macOS warns on the first launch that
  # it can't check the app. The documentation tells people how to go on.
  macos:
    strategy:
      # One processor failing says nothing about the other: let both finish.
      fail-fast: false
      matrix:
        include:
          # The app is built for the processor of the runner it is built on.
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    permissions:
      # Uploading a file to the release.
      contents: write
    # A newer push to the same PR cancels its build still in progress.
    concurrency:
      group: desktop-macos-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Check the tag matches package.json
        if: ${{ github.event_name == 'release' }}
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::package.json is at $version but the release tag is $TAG"
            exit 1
          fi
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      # Spotlight starts indexing a disk image as soon as it is mounted, and
      # the build then can't eject it ("Resource busy").
      - name: Turn off Spotlight indexing
        run: sudo mdutil -a -i off
      # Builds the app, packages it into the disk image and checks the app's
      # signature.
      - run: npm run desktop:package
      # A runner of the wrong processor would publish a mislabeled file.
      - name: Check the disk image is for ${{ matrix.arch }}
        run: ls desktop/release/nutria-*-${{ matrix.arch }}.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: nutria-macos-${{ matrix.arch }}
          path: desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Attach the disk image to the release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" desktop/release/*.dmg --clobber
