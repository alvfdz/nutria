# Self-hosting: Nutria and its PostgreSQL database. Engine-agnostic: it runs
# unchanged under `podman compose` and `docker compose` (see the README for the
# one-time plugin setup each engine needs).
#
# Configured through `.env` (copy `.env.example`). `POSTGRES_PASSWORD` and
# `BETTER_AUTH_SECRET` are required; everything else has a default.
#
#   podman compose up -d --build --wait
#
# Development uses `compose.dev.yaml` instead.
services:
  app:
    build: .
    image: localhost/nutria
    environment:
      # Inside the compose network the database is reachable as `postgres`.
      # The user and password are not URL-encoded: avoid `@ / : #` in them.
      DATABASE_URL: postgresql://${POSTGRES_USER:-nutria}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-nutria}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (openssl rand -base64 32)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # Proxies whose X-Forwarded-For hops are trusted. See `.env.example`.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Decides when "today" starts. See `.env.example`.
      TZ: ${TZ:-UTC}
    ports: ["${APP_PORT:-3000}:3000"]
    depends_on:
      postgres:
        condition: service_healthy
    # The container applies pending migrations before serving, so the first
    # start takes a few seconds longer. The app has no curl, so the probe is a
    # one-liner on the bundled Node.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nutria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nutria}
    # No published port: only the app, over the compose network, reaches the
    # database.
    # The named volume is what makes the data survive restarts. It mounts at
    # /var/lib/postgresql rather than .../data because PostgreSQL 18 stores its
    # clusters in major-version subdirectories, and the image refuses to start
    # against a mount sitting at the old location.
    volumes: ["nutria-postgres:/var/lib/postgresql"]
    # Lets `up -d --wait` and `depends_on: service_healthy` hold off on a
    # database that is not accepting connections yet.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nutria} -d ${POSTGRES_DB:-nutria}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  nutria-postgres:
