# Packages the build in `dist/` (see `scripts/build.mjs`) for the system
# `scripts/package.mjs` runs on: an unpacked app on Linux, which
# `scripts/flatpak.mjs` wraps in a Flatpak, and an installer on Windows.
appId: io.github.alvfdz.Nutria
productName: Nutria
executableName: nutria
copyright: Nutria contributors. MIT License.

directories:
  output: release

# The two bundled processes. The production dependencies (PGlite) are added
# from `node_modules` automatically.
files:
  - dist/main.cjs
  - dist/server.mjs
  - package.json

# No archive: PGlite reads its WebAssembly files from disk.
asar: false
# Nothing here is a native module.
npmRebuild: false

# Adds Nutria's server and migrations next to the app, and checks that
# nothing machine-specific is shipped.
afterPack: ./scripts/after-pack.mjs

linux:
  target: dir

win:
  target:
    - target: nsis
      arch: [x64]
  # electron-builder turns it into the `.ico` Windows wants.
  icon: icons/icon.png

# A one-click installer for the current user: no questions and no
# administrator rights. Uninstalling leaves the data folder in place.
nsis:
  artifactName: nutria-${version}-${arch}-setup.${ext}
