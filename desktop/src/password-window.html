<!doctype html>
<!--
  Shows a password the desktop app just generated, once. It is a window of
  the app's own, rather than a system dialog, so its Copy button works on
  Wayland: there, only a window the user just clicked in may set the
  clipboard. `main.ts` opens it with the email and password in the query,
  with no Node.js access and no preload script.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your new password</title>
    <style>
      /* The design system's palette (docs/design-system.md). */
      :root {
        color-scheme: light dark;
        --background: #ffffff;
        --foreground: #09090b;
        --muted: #f4f4f5;
        --muted-foreground: #71717a;
        --border: #e4e4e7;
        --ring: #a1a1aa;
        --primary: #18181b;
        --primary-foreground: #fafafa;
        --secondary: #e4e4e7;
        --secondary-foreground: #18181b;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #09090b;
          --foreground: #fafafa;
          --muted: #18181b;
          --muted-foreground: #a1a1aa;
          --border: #27272a;
          --ring: #71717a;
          --primary: #fafafa;
          --primary-foreground: #18181b;
          --secondary: #27272a;
          --secondary-foreground: #fafafa;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
        background: var(--background);
        color: var(--foreground);
        font:
          14px/20px system-ui,
          sans-serif;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        line-height: 24px;
        font-weight: 600;
      }

      p {
        margin: 0;
        color: var(--muted-foreground);
        overflow-wrap: anywhere;
      }

      .password {
        display: flex;
        gap: 8px;
      }

      input {
        flex: 1;
        min-width: 0;
        height: 36px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--muted);
        color: var(--foreground);
        font:
          15px ui-monospace,
          monospace;
      }

      button {
        height: 36px;
        padding: 0 16px;
        border: 0;
        border-radius: 8px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }

      input:focus-visible,
      button:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--ring) 50%, transparent);
        outline-offset: 1px;
      }

      .primary {
        background: var(--primary);
        color: var(--primary-foreground);
      }

      .secondary {
        background: var(--secondary);
        color: var(--secondary-foreground);
      }

      .actions {
        display: flex;
        justify-content: flex-end;
      }
    </style>
  </head>
  <body>
    <h1>Your new password</h1>
    <p>
      Sign in as <strong id="email"></strong> with this password, then choose
      one of your own on the Account page. Nutria won't show it again.
    </p>
    <div class="password">
      <input
        id="password"
        readonly
        aria-label="New password"
        spellcheck="false"
      />
      <button id="copy" class="primary" type="button">Copy</button>
    </div>
    <div class="actions">
      <button id="done" class="secondary" type="button">Go to sign in</button>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const field = document.getElementById("password");
      const copy = document.getElementById("copy");

      document.getElementById("email").textContent = params.get("email");
      field.value = params.get("password");
      field.addEventListener("focus", () => field.select());

      copy.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(field.value);
        } catch {
          // Without the clipboard API, copy the selection the old way.
          field.select();
          document.execCommand("copy");
        }
        copy.textContent = "Copied";
      });

      document.getElementById("done").addEventListener("click", () => {
        window.close();
      });
    </script>
  </body>
</html>
