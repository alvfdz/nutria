# Development database. `npm run dev` serves the app on the host, so this file
# runs PostgreSQL alone, with fixed development-only credentials that match
# `DATABASE_URL` in the committed `.env.development`. It reads no `.env`.
#
#   docker compose -f compose.dev.yaml up -d --wait   # or: podman compose ...
#
# Its own project name keeps the containers and the volume apart from the
# self-hosting stack in `compose.yaml`.
name: nutria-dev

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: nutria
      POSTGRES_PASSWORD: nutria
      POSTGRES_DB: nutria
    # Loopback only: the development credentials are public.
    ports: ["127.0.0.1:5432:5432"]
    # It mounts at /var/lib/postgresql rather than .../data because PostgreSQL
    # 18 stores its clusters in major-version subdirectories, and the image
    # refuses to start against a mount sitting at the old location.
    volumes: ["nutria-dev-postgres:/var/lib/postgresql"]
    # Lets `up -d --wait` hold off until the database accepts connections, so
    # a migration run right after cannot race it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutria -d nutria"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  nutria-dev-postgres:
